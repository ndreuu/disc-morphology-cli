[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-morphology-cli"
version = "0.1.0"
description = "DICOM to an interactive local report of research disc-mask geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "pydicom>=3.0,<4", "Pillow>=10,<14"]

[project.scripts]
disc-morphology = "disc_morphology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disc_morphology = ["assets/*"]
